<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Interactive certification test bank rebuilt from the supplied TXT source.">
  <title>Complete Test Bank</title>
  <style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#eef2f8;--text:#142033;--muted:#64748b;--line:#dce3ee;--primary:#2563eb;--primary2:#1d4ed8;--good:#15803d;--goodbg:#ecfdf3;--bad:#c62828;--badbg:#fff1f2;--warn:#a16207;--warnbg:#fffbeb;--shadow:0 12px 35px rgba(26,40,73,.08);--radius:18px}
[data-theme="dark"]{--bg:#0b1120;--surface:#111a2c;--surface2:#182338;--text:#e8eef8;--muted:#9eabc0;--line:#263551;--primary:#6ea0ff;--primary2:#8ab4ff;--good:#50d17b;--goodbg:#0e2d1c;--bad:#ff7b82;--badbg:#35161c;--warn:#f4c45d;--warnbg:#342a10;--shadow:0 14px 40px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;height:72px;padding:0 max(24px,calc((100vw - 1240px)/2));background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:800;text-decoration:none;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--primary);color:white;font-size:14px}nav{display:flex;gap:4px;margin-right:auto}.nav-btn,.icon-btn,.btn,.select,.search{font:inherit}.nav-btn,.icon-btn{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:10px;cursor:pointer}.nav-btn:hover,.nav-btn.active{background:var(--surface2);color:var(--text)}.icon-btn{border:1px solid var(--line);background:var(--surface);font-size:20px}main{max-width:1240px;margin:0 auto;padding:38px 24px 80px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--primary);font-size:12px;font-weight:800}h1{font-size:clamp(30px,5vw,48px);line-height:1.08;margin:8px 0 10px;letter-spacing:-.04em}h2{font-size:24px;margin:36px 0 16px}h3{line-height:1.45}.lede{color:var(--muted);max-width:720px;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0}.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:28px;letter-spacing:-.03em}.stat span{color:var(--muted);font-size:14px}.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.action-card,.chapter-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.action-card h3,.chapter-card h3{margin:0 0 5px}.action-card p,.chapter-card p{color:var(--muted);margin:0 0 18px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:750;cursor:pointer;background:var(--primary);color:#fff}.btn:hover{background:var(--primary2)}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.chapter-top{display:flex;justify-content:space-between;gap:10px}.count{color:var(--primary);font-weight:800;font-size:14px}.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:16px 0}.progress span{display:block;height:100%;background:var(--primary);border-radius:inherit}.chapter-footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.toolbar{position:sticky;top:86px;z-index:10;display:grid;grid-template-columns:minmax(250px,1fr) repeat(3,auto);gap:10px;background:var(--surface);padding:12px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:22px 0}.search,.select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:11px 12px;min-height:46px}.summary-row{display:flex;align-items:center;justify-content:space-between;gap:18px;color:var(--muted);margin:20px 0 12px}.question-list{display:grid;gap:18px}.question-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);scroll-margin-top:160px}.question-meta{display:flex;align-items:center;gap:10px}.q-number{font-weight:800;color:var(--primary)}.status-badge{font-size:12px;font-weight:750;border-radius:99px;padding:4px 9px;background:var(--surface2);color:var(--muted)}.status-badge.verified{background:var(--goodbg);color:var(--good)}.status-badge.unverified{background:var(--warnbg);color:var(--warn)}.bookmark-btn{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:25px;cursor:pointer}.bookmark-btn.saved{color:#f59e0b}.question-text{font-size:19px;margin:16px 0 18px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:13px;padding:14px 15px;cursor:pointer;font:inherit}.choice:hover:not(:disabled){border-color:var(--primary);transform:translateY(-1px)}.choice:disabled{cursor:default}.choice-label{display:grid;place-items:center;flex:0 0 28px;height:28px;border-radius:8px;background:var(--surface2);font-weight:800;font-size:13px}.choice.correct{border-color:var(--good);background:var(--goodbg);color:var(--good)}.choice.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}.choice.selected-unverified{border-color:var(--warn);background:var(--warnbg)}.feedback{margin-top:14px;padding:13px 15px;border-radius:11px;font-weight:700}.feedback.good{background:var(--goodbg);color:var(--good)}.feedback.bad{background:var(--badbg);color:var(--bad)}.feedback.warn{background:var(--warnbg);color:var(--warn)}.source-meta{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin:24px 0;flex-wrap:wrap}.page-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);min-width:42px;height:42px;border-radius:10px;cursor:pointer}.page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}.empty{padding:50px 24px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}.loading{min-height:60vh;display:grid;place-content:center;text-align:center;color:var(--muted)}.spinner{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.audit{margin-top:35px;padding:18px 20px;border-radius:16px;background:var(--surface2);color:var(--muted);font-size:14px}.audit strong{color:var(--text)}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.quick-actions,.chapters{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.topbar{padding:0 16px;gap:10px}.brand span:last-child{display:none}}
@media(max-width:600px){main{padding:25px 14px 60px}.topbar{height:auto;min-height:66px;flex-wrap:wrap;padding-block:10px}.topbar nav{order:3;width:100%;overflow:auto}.nav-btn{flex:1;padding:8px}.stats,.quick-actions,.chapters,.toolbar{grid-template-columns:1fr}.toolbar{top:112px}.toolbar .search{grid-column:auto}.question-card{padding:18px}.question-text{font-size:17px}.summary-row{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-view="dashboard"><span class="brand-mark">TB</span><span>Test Bank</span></a>
    <nav aria-label="Main navigation">
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="practice">Practice</button>
      <button class="nav-btn" data-view="bank">Question Bank</button>
    </nav>
    <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode">☾</button>
  </header>

  <main id="app" aria-live="polite">
    <section id="loading" class="loading"><div class="spinner"></div><p>Loading the complete question bank…</p></section>
  </main>

  <template id="questionTemplate">
    <article class="question-card">
      <div class="question-meta"><span class="q-number"></span><span class="status-badge"></span><button class="bookmark-btn" aria-label="Bookmark question">☆</button></div>
      <h3 class="question-text"></h3>
      <div class="choices"></div>
      <div class="feedback" hidden></div>
      <footer class="source-meta"></footer>
    </article>
  </template>

  <script>
const app=document.querySelector('#app');
const state={questions:[],audit:null,view:'dashboard',page:1,perPage:10,chapter:'All Chapters',status:'all',query:'',mode:'all',session:null};
const KEY='complete-test-bank-txt-v3';
const saved=JSON.parse(localStorage.getItem(KEY)||'{}');
saved.answers??={};saved.bookmarks??=[];saved.theme??='light';saved.perPage??=10;
state.perPage=saved.perPage;document.documentElement.dataset.theme=saved.theme;
const persist=()=>localStorage.setItem(KEY,JSON.stringify(saved));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chapters=()=>[...new Set(state.questions.map(q=>q.chapter))];
const answered=q=>saved.answers[q.id];
const filtered=()=>state.questions.filter(q=>{
  const a=answered(q),book=saved.bookmarks.includes(q.id),term=state.query.toLowerCase();
  return (state.chapter==='All Chapters'||q.chapter===state.chapter)&&
    (!term||q.question.toLowerCase().includes(term)||q.choices.some(c=>c.text.toLowerCase().includes(term)))&&
    (state.status==='all'||(state.status==='verified'&&q.correctAnswer)||(state.status==='unverified'&&!q.correctAnswer)||(state.status==='bookmarked'&&book)||(state.status==='incorrect'&&a&&q.correctAnswer&&!q.multiSelect&&a.choice!==q.correctAnswer))&&
    (state.mode==='all'||(state.mode==='bookmarked'&&book)||(state.mode==='mistakes'&&a&&q.correctAnswer&&!q.multiSelect&&a.choice!==q.correctAnswer));
});

function setView(view){state.view=view;state.page=1;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render();scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){e.preventDefault();setView(v.dataset.view)}});
document.querySelector('#themeToggle').onclick=()=>{saved.theme=saved.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=saved.theme;persist()};

function stats(){let correct=0,incorrect=0;for(const [id,a] of Object.entries(saved.answers)){const q=state.questions.find(x=>x.id===+id);if(!q?.correctAnswer||q.multiSelect)continue;a.choice===q.correctAnswer?correct++:incorrect++}return{answered:Object.keys(saved.answers).length,correct,incorrect,bookmarks:saved.bookmarks.length}}
function dashboard(){const s=stats();const cards=[['Questions',state.audit.questionsImported],['Source-confirmed answers',state.audit.confirmedAnswers],['Answers not provided',state.audit.noConfirmedAnswer],['Overall accuracy',s.correct+s.incorrect?Math.round(s.correct/(s.correct+s.incorrect)*100)+'%':'—']];app.innerHTML=`<section><span class="eyebrow">TXT source · Strict extraction</span><h1>Study the complete question bank.</h1><p class="lede">Every imported answer comes directly from the TXT file. Nothing was guessed, inferred, or copied from the earlier PDF extraction.</p><div class="stats">${cards.map(x=>`<div class="stat"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('')}</div><div class="quick-actions"><div class="action-card"><h3>Continue studying</h3><p>Resume with your answers and page preferences intact.</p><button class="btn" data-action="all">Open all questions</button></div><div class="action-card"><h3>Mistakes only</h3><p>Focus on ${s.incorrect} scored questions answered incorrectly.</p><button class="btn secondary" data-action="mistakes">Review mistakes</button></div><div class="action-card"><h3>Bookmarks</h3><p>Return to ${s.bookmarks} questions you saved for later.</p><button class="btn secondary" data-action="bookmarked">Open bookmarks</button></div></div><h2>Sections</h2><div class="chapters">${chapters().map(ch=>chapterCard(ch)).join('')}</div><div class="audit"><strong>Verification report:</strong> ${state.audit.sourceLines.toLocaleString()} source lines checked · Questions found: ${state.audit.questionsFound} · Questions imported: ${state.audit.questionsImported} · ${state.audit.confirmedAnswers} answers explicitly confirmed · ${state.audit.noConfirmedAnswer} without a source answer.</div></section>`;bindDashboard()}
function chapterCard(ch){const qs=state.questions.filter(q=>q.chapter===ch),done=qs.filter(answered).length,pct=Math.round(done/qs.length*100);return`<article class="chapter-card"><div class="chapter-top"><h3>${esc(ch)}</h3><span class="count">${qs.length}</span></div><p>Source questions</p><div class="progress"><span style="width:${pct}%"></span></div><div class="chapter-footer"><span>${done} / ${qs.length} answered</span><button class="btn secondary" data-chapter="${esc(ch)}">Practice</button></div></article>`}
function bindDashboard(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.action;state.chapter='All Chapters';setView('practice')});document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{state.mode='all';state.chapter=b.dataset.chapter;setView('practice')})}

function practice(){const data=filtered(),pages=Math.max(1,Math.ceil(data.length/state.perPage));state.page=Math.min(state.page,pages);const start=(state.page-1)*state.perPage,slice=data.slice(start,start+state.perPage);app.innerHTML=`<section><span class="eyebrow">Interactive practice</span><h1>${state.mode==='mistakes'?'Mistakes':state.mode==='bookmarked'?'Bookmarks':state.chapter==='All Chapters'?'All Questions':esc(state.chapter)}</h1>${toolbar()}<div class="summary-row"><span>Showing ${data.length?start+1:0}–${Math.min(start+state.perPage,data.length)} of ${data.length} questions</span><span>Page ${state.page} of ${pages}</span></div>${pagination(pages)}<div class="question-list">${slice.length?'':'<div class="empty">No questions match these filters.</div>'}</div>${pagination(pages)}</section>`;slice.forEach(q=>renderQuestion(q));bindPractice()}
function toolbar(){return`<div class="toolbar"><input class="search" id="search" type="search" placeholder="Search questions…" value="${esc(state.query)}"><select class="select" id="chapter"><option>All Chapters</option>${chapters().map(c=>`<option ${c===state.chapter?'selected':''}>${esc(c)}</option>`).join('')}</select><select class="select" id="status"><option value="all">All statuses</option><option value="verified" ${state.status==='verified'?'selected':''}>Verified answers</option><option value="unverified" ${state.status==='unverified'?'selected':''}>Unverified answers</option><option value="incorrect" ${state.status==='incorrect'?'selected':''}>Incorrect</option><option value="bookmarked" ${state.status==='bookmarked'?'selected':''}>Bookmarked</option></select><select class="select" id="perPage">${[10,20,30,50].map(n=>`<option ${n===state.perPage?'selected':''}>${n} per page</option>`).join('')}</select></div>`}
function pagination(total){if(total<=1)return'';let nums=[];for(let i=Math.max(1,state.page-2);i<=Math.min(total,state.page+2);i++)nums.push(i);return`<nav class="pagination" aria-label="Pagination"><button class="page-btn" data-page="${Math.max(1,state.page-1)}">←</button>${nums.map(n=>`<button class="page-btn ${n===state.page?'active':''}" data-page="${n}">${n}</button>`).join('')}<button class="page-btn" data-page="${Math.min(total,state.page+1)}">→</button></nav>`}
function renderQuestion(q){const node=document.querySelector('#questionTemplate').content.cloneNode(true),card=node.querySelector('.question-card'),a=answered(q);card.dataset.id=q.id;node.querySelector('.q-number').textContent=`Question ${q.id}`;const badge=node.querySelector('.status-badge');badge.textContent=!q.correctAnswer?'Answer not provided':q.multiSelect?'TXT answer · Multi-select':'TXT-confirmed answer';badge.classList.add(q.correctAnswer?'verified':'unverified');node.querySelector('.question-text').textContent=q.question;const bm=node.querySelector('.bookmark-btn');bm.classList.toggle('saved',saved.bookmarks.includes(q.id));bm.textContent=saved.bookmarks.includes(q.id)?'★':'☆';bm.onclick=()=>toggleBookmark(q.id,bm);const choices=node.querySelector('.choices');q.choices.forEach(c=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="choice-label">${esc(c.label)}</span><span>${esc(c.text)}</span>`;b.onclick=()=>choose(q,c.label,card);choices.append(b)});node.querySelector('.source-meta').textContent=`${q.chapter} · TXT line ${q.sourceLine}${q.sourceQuestionNumber?` · Source question ${q.sourceQuestionNumber}`:''}`;document.querySelector('.question-list').append(node);if(a)paint(q,a.choice,card)}
function choose(q,label,card){if(answered(q))return;saved.answers[q.id]={choice:label,at:Date.now()};persist();paint(q,label,card)}
function paint(q,label,card){const buttons=[...card.querySelectorAll('.choice')],feedback=card.querySelector('.feedback');buttons.forEach((b,i)=>{const l=q.choices[i].label;b.disabled=true;if(q.correctAnswer&&q.correctAnswer.includes(l))b.classList.add('correct');if(l===label&&q.correctAnswer&&!q.correctAnswer.includes(l))b.classList.add('wrong');if(l===label&&!q.correctAnswer)b.classList.add('selected-unverified')});feedback.hidden=false;if(!q.correctAnswer){feedback.className='feedback warn';feedback.textContent='Answer not available — no confirmed answer was found in the provided source, so this question is not scored.'}else if(q.multiSelect){feedback.className='feedback warn';feedback.textContent=`Multi-select source answer: ${q.correctAnswer.split('').join(', ')} — displayed for study and excluded from scoring.`}else if(label===q.correctAnswer){feedback.className='feedback good';feedback.textContent='Correct ✓'}else{feedback.className='feedback bad';feedback.textContent=`Incorrect ✕ — Correct answer: ${q.correctAnswer}`}}
function toggleBookmark(id,b){const i=saved.bookmarks.indexOf(id);i<0?saved.bookmarks.push(id):saved.bookmarks.splice(i,1);persist();b.classList.toggle('saved',i<0);b.textContent=i<0?'★':'☆'}
function bindPractice(){let timer;document.querySelector('#search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.query=e.target.value;state.page=1;practice()},180)};document.querySelector('#chapter').onchange=e=>{state.chapter=e.target.value;state.page=1;practice()};document.querySelector('#status').onchange=e=>{state.status=e.target.value;state.page=1;practice()};document.querySelector('#perPage').onchange=e=>{state.perPage=parseInt(e.target.value);saved.perPage=state.perPage;persist();state.page=1;practice()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=+b.dataset.page;practice();scrollTo({top:0,behavior:'smooth'})})}
function render(){state.view==='dashboard'?dashboard():practice()}
const INLINE_QUESTIONS=[{"id":1,"chapter":"Big Data and Data Science","sourceQuestionNumber":"1","sourceLine":5,"question":"Data for big data ingestion can also be called the data lake. This needs to be carefully managed or the data lake will become?","choices":[{"label":"A","text":"An organizational statistic"},{"label":"B","text":"A biased report"},{"label":"C","text":"A level of data not usable by data scientists"},{"label":"D","text":"A data model"},{"label":"E","text":"A data swamp."}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":2,"chapter":"Big Data and Data Science","sourceQuestionNumber":"2","sourceLine":15,"question":"Which of the following uses for a Data Mining tool is not optimal?","choices":[{"label":"A","text":"Analyze supermarket scanner data to determine when people are most likely to shop and buy certain products"},{"label":"B","text":"Fraud Detection"},{"label":"C","text":"Identification of data quality issues with your SAP Financial system"},{"label":"D","text":"Predictive Analysis"},{"label":"E","text":"Customer Segmentation and Scoring."}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":3,"chapter":"Big Data and Data Science","sourceQuestionNumber":"3","sourceLine":26,"question":"You need to discover possible relationships or to show data patterns in an exploratory fashion when you do not necessarily have a specific question to ask. What kind of data tool would you use to identify patterns of data using various algorithms?","choices":[{"label":"A","text":"ETL Jobs"},{"label":"B","text":"Data Quality Profiler"},{"label":"C","text":"Meta-Data Data Lineage View"},{"label":"D","text":"Data Mining"},{"label":"E","text":"Data Visualization Application."}],"correctAnswer":"D","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":4,"chapter":"Big Data and Data Science","sourceQuestionNumber":"4","sourceLine":39,"question":"Big data is often defined by three characteristics. They are:","choices":[{"label":"A","text":"Volume, Variety, and Velocity"},{"label":"B","text":"Complexity, Compliance and Completeness"},{"label":"C","text":"Size, Speed, and Sensitivity"},{"label":"D","text":"Direction, Depth and Details"},{"label":"E","text":"Expansive, Engaged and Enormous."}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":5,"chapter":"Big Data and Data Science","sourceQuestionNumber":"5","sourceLine":48,"question":"Big data management requires","choices":[{"label":"A","text":"less discipline than relational data management"},{"label":"B","text":"more discipline than relational data management"},{"label":"C","text":"no discipline at all"},{"label":"D","text":"a certification in data science"},{"label":"E","text":"big ideas with big budgets."}],"correctAnswer":"B","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":6,"chapter":"Big Data and Data Science","sourceQuestionNumber":"6","sourceLine":60,"question":"A 'Data Lake' is an environment where a vast amount of data can be","choices":[{"label":"A","text":"updated, obfuscated, nullified and cleansed"},{"label":"B","text":"digested, processed, deleted and visualized"},{"label":"C","text":"ingested, screened, obfuscated and purged"},{"label":"D","text":"purged, sorted, split and scanned"},{"label":"E","text":"ingested, shared, assessed and analyzed."}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":7,"chapter":"Big Data and Data Science","sourceQuestionNumber":"7","sourceLine":69,"question":"What does data mining determine?","choices":[{"label":"A","text":"The process of collecting data elements to help organizations formally manage and gain better control over data assets"},{"label":"B","text":"The process of finding correlated features in a dataset"},{"label":"C","text":"The process of manipulating data using a computer"},{"label":"D","text":"The process of describing the results of various operations in a data warehouse"},{"label":"E","text":"The process of finding anomalies, patterns, and correlations within large datasets to predict outcomes"}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":8,"chapter":"Big Data and Data Science","sourceQuestionNumber":"8","sourceLine":82,"question":"A sandbox is a type of database environment used for","choices":[{"label":"A","text":"User Acceptance Testing"},{"label":"B","text":"Low-budget projects"},{"label":"C","text":"Production backups"},{"label":"D","text":"Remote users"},{"label":"E","text":"Proofs of concept and to test hypotheses"}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":9,"chapter":"Big Data and Data Science","sourceQuestionNumber":"9","sourceLine":91,"question":"Sentiment analysis of call center voice files is performed by text analysis and stored in a relational database. Which of the following is true?","choices":[{"label":"A","text":"The voice files are structured data and the sentiment analysis is unstructured data"},{"label":"B","text":"They are both unstructured data"},{"label":"C","text":"The voice files are unstructured data and the sentiment analysis is structured data"},{"label":"D","text":"They are both structured data"},{"label":"E","text":"Structured and unstructured data are the same things"}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":10,"chapter":"Data Architecture","sourceQuestionNumber":"1","sourceLine":114,"question":"In the common enterprise architecture model coded BIAT, the 'I' stands for?","choices":[{"label":"A","text":"Information"},{"label":"B","text":"Integration"},{"label":"C","text":"Interoperability"},{"label":"D","text":"Instance"},{"label":"E","text":"Identification."}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":11,"chapter":"Data Architecture","sourceQuestionNumber":"2","sourceLine":123,"question":"Data flows can be represented by","choices":[{"label":"A","text":"Two-dimensional matrices showing the relationships between data entities and business processes"},{"label":"B","text":"Two-dimensional matrices showing the relationships between data users and business processes"},{"label":"C","text":"Two-dimensional matrices showing the relationships between data users and data consumers"},{"label":"D","text":"Two-dimensional matrices showing the relationships between data facts and data dimensions"},{"label":"E","text":"Two-dimensional matrices showing the relationships between data entities and data quality."}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":12,"chapter":"Data Architecture","sourceQuestionNumber":"3","sourceLine":142,"question":"An enterprise data model would be composed of","choices":[{"label":"A","text":"Conceptual models, logical models, and physical models"},{"label":"B","text":"Conceptual models, subject area models, and logical models"},{"label":"C","text":"Logical models, physical models, and infrastructure models"},{"label":"D","text":"Conceptual models, star schema models, and interface models"},{"label":"E","text":"Enterprise models, data models, and compositional models."}],"correctAnswer":"B","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":13,"chapter":"Data Architecture","sourceQuestionNumber":"4"," e other employee and may manage one or more employees. There is an indeterminate number of levels in this management hierarchy. What type of relationship would work best?","choices":[{"label":"A","text":"recursive"},{"label":"B","text":"one-to-one"},{"label":"C","text":"subtyping"},{"label":"D","text":"identifying"},{"label":"E","text":"non-identifying"}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":142,"chapter":"Data Modeling and Design","sourceQuestionNumber":"38","sourceLine":1524,"question":"The most common term for \"entity\" in the physical level of a model is","choices":[{"label":"A","text":"Index"},{"label":"B","text":"Primary Key"},{"label":"C","text":"Table"},{"label":"D","text":"Diagram"},{"label":"E","text":"Database"}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":143,"chapter":"Data Quality","sourceQuestionNumber":"1","sourceLine":1538,"question":"Data Quality rules and standards are a form of data. To be effective, they need to be managed as data and rules should be ___________?","choices":[{"label":"A","text":"Managed outside of the repository and only the results of Data Quality assessments stored as rules metadata"},{"label":"B","text":"Organized with metrics so the data stewards can review the data and see what rules apply"},{"label":"C","text":"Documented consistently, tied to business impact, backed by data analysis, and assessable to all data consumers"},{"label":"D","text":"Focused on managing relationships that have gone wrong in the past and may go wrong in the future"},{"label":"E","text":"Focused on rules that can be integrated into application services."}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":144,"chapter":"Data Quality","sourceQuestionNumber":"2","sourceLine":1554,"question":"A Data Quality Dimension is","choices":[{"label":"A","text":"The value of a particular piece of data"},{"label":"B","text":"A core concept in dimensional modeling"},{"label":"C","text":"A valid value in a list"},{"label":"D","text":"A measurable feature or characteristic of data"},{"label":"E","text":"One aspect of Data Quality used extensively in Data Governance"}],"correctAnswer":"D","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":145,"chapter":"Data Quality","sourceQuestionNumber":"3","sourceLine":1563,"question":"The Data Quality Management cycle has four stages. Three are Plan, Monitor, and Act. What is the fourth stage?","choices":[{"label":"A","text":"Improve"},{"label":"B","text":"Prepare"},{"label":"C","text":"Reiterate"},{"label":"D","text":"Deploy"},{"label":"E","text":"Manage"}],"correctAnswer":"D","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":146,"chapter":"Data Quality","sourceQuestionNumber":"4","sourceLine":1573,"question":"Which of these is NOT a primary deliverable of Data Quality Management?","choices":[{"label":"A","text":"Data attribute definitions"},{"label":"B","text":"Data Quality strategy and framework"},{"label":"C","text":"Analysis from data profiling"},{"label":"D","text":"Data Quality service level agreements"},{"label":"E","text":"Data Quality reports"}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":147,"chapter":"Data Quality","sourceQuestionNumber":"5","sourceLine":1582,"question":"Which of the following is NOT a stage of the Data Quality Management Cycle?","choices":[{"label":"A","text":"Plan"},{"label":"B","text":"Check"},{"label":"C","text":"Act"},{"label":"D","text":"Intervene"},{"label":"E","text":"Do"}],"correctAnswer":"D","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":148,"chapter":"Data Quality","sourceQuestionNumber":"6","sourceLine":1594,"question":"Which of these is NOT a typical activity in Data Quality Management?","choices":[{"label":"A","text":"Defining business requirements and business rules"},{"label":"B","text":"Analyzing Data Quality"},{"label":"C","text":"Creating inspection and monitoring processes"},{"label":"D","text":"Identifying data problems and issues"},{"label":"E","text":"Enterprise Data Modelling"}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":149,"chapter":"Data Quality","sourceQuestionNumber":"7","sourceLine":1603,"question":"Which of the following is NOT a stage in the Shewhart - Deming Cycle that drives the Data Quality Improvement Lifecycle?","choices":[{"label":"A","text":"Plan"},{"label":"B","text":"Do"},{"label":"C","text":"Investigate"},{"label":"D","text":"Check"},{"label":"E","text":"Act"}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":150,"chapter":"Data Quality","sourceQuestionNumber":"8","sourceLine":1613,"question":"Which of these statements is true?","choices":[{"label":"A","text":"Data Quality Management is a synonym for Data Governance"},{"label":"B","text":"Data Quality Management is a continuous process"},{"label":"C","text":"Data Quality Management only addresses structured data"},{"label":"D","text":"Data Quality Management is the application of technology to data problems"},{"label":"E","text":"Data Quality Management is usually a one-off project"}],"correctAnswer":"B","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":151,"chapter":"Data Quality","sourceQuestionNumber":"9","sourceLine":1622,"question":"What is the goal of collecting and documenting business rules?","choices":[{"label":"A","text":"To identify potential sources of data for the Data Integration effort"},{"label":"B","text":"To reuse existing Data Integration solutions"},{"label":"C","text":"To direct when to manually trigger events and alerts"},{"label":"D","text":"To design user-experience"},{"label":"E","text":"To identify the requirements for the Data Quality"}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":152,"chapter":"Data Quality","sourceQuestionNumber":"10","sourceLine":1631,"question":"When defining Data Quality indicators, care must be taken to ensure that they have what?","choices":[{"label":"A","text":"Measurability, Relevance, and Acceptability"},{"label":"B","text":"A direct link to the Data Governance strategy"},{"label":"C","text":"Items in the dashboard showing their improvement over time"},{"label":"D","text":"The core dimensions of Data Quality"},{"label":"E","text":"Timeliness, Validity, and Accuracy"}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":153,"chapter":"Data Quality","sourceQuestionNumber":"11","sourceLine":1642,"question":"You are facilitating a committee that is developing data quality metrics. Some of the committee members think that SMART (Specific, Measurable, Accountable, Results-focused, Time-Bound) is a good model. Select the statement that best describes why business relevance needs to be considered as a characteristic of Data Quality Metrics","choices":[{"label":"A","text":"Unless you use business terms the end-users won't understand and lose interest in the program"},{"label":"B","text":"Business relevance needs to be considered as a Data Quality metric in its own right"},{"label":"C","text":"Any IT Program must have some business relevance defined, or it is a waste of time"},{"label":"D","text":"The value of the metric is limited unless it can be linked to some aspect of a business. The metric's acceptability threshold needs to correlate with business expectations"},{"label":"E","text":"Expressing business relevance in requirements assists the metadata strategy"}],"correctAnswer":"D","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":154,"chapter":"Data Quality","sourceQuestionNumber":"12","sourceLine":1658,"question":"Top-down and Bottom-up data analysis and profiling are best done in concert because","choices":[{"label":"A","text":"It gets everyone involved"},{"label":"B","text":"It gives something for the architects to do while the profiles get on with the work"},{"label":"C","text":"It allows the profilers to show the business the true state of the data"},{"label":"D","text":"Data Quality tools are more productive when they are effectively configured"},{"label":"E","text":"It balances business relevance and the actual state of the data"}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":155,"chapter":"Data Quality","sourceQuestionNumber":"13","sourceLine":1667,"question":"Which of these is NOT an expected role of a Data Quality Oversight Board?","choices":[{"label":"A","text":"Setting Data Quality Improvement priorities"},{"label":"B","text":"Establishing communications and feedback mechanisms"},{"label":"C","text":"Data Profiling and Analysis"},{"label":"D","text":"Producing certification and compliance policies"},{"label":"E","text":"Development and maintaining Data Quality"}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":156,"chapter":"Data Quality","sourceQuestionNumber":"14","sourceLine":1676,"question":"According to the DMBoK, which of these is NOT a valid dimension of Data Quality?","choices":[{"label":"A","text":"Relevance"},{"label":"B","text":"Timeliness"},{"label":"C","text":"Currency"},{"label":"D","text":"Completeness"},{"label":"E","text":"Reasonableness"}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":157,"chapter":"Data Quality","sourceQuestionNumber":"15","sourceLine":1685,"question":"What is the purpose of a data lineage tool?","choices":[{"label":"A","text":"List of potential data integration opportunities"},{"label":"B","text":"Formal Data Quality Assessment of a dataset"},{"label":"C","text":"Description of a dataset's phase within the data lifecycle"},{"label":"D","text":"Tracking Historical changes to a dataset"},{"label":"E","text":"Collection of all the metadata related to a dataset"}],"correctAnswer":"D","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":158,"chapter":"Data Quality","sourceQuestionNumber":"16","sourceLine":1694,"question":"Which of the following is NOT usually a feature of Data Quality improvement tools?","choices":[{"label":"A","text":"Data profiling"},{"label":"B","text":"Parsing"},{"label":"C","text":"Data Modeling"},{"label":"D","text":"Transformation"},{"label":"E","text":"Standardization"}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":159,"chapter":"Data Quality","sourceQuestionNumber":"17","sourceLine":1705,"question":"A Data Quality Service Level Agreement (SLA) would normally include which of these","choices":[{"label":"A","text":"Roles and responsibilities for Data Quality"},{"label":"B","text":"A business case for data improvement"},{"label":"C","text":"An enterprise data model"},{"label":"D","text":"Detailed technical specifications for data transfer"},{"label":"E","text":"A breakdown of the costs of Data Quality improvement"}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":160,"chapter":"Data Quality","sourceQuestionNumber":"18","sourceLine":1714,"question":"Data quality measurements can be taken at three levels of granularity. They are:","choices":[{"label":"A","text":"Departmental data, regional data, and enterprise data"},{"label":"B","text":"Person data, location data, and product data"},{"label":"C","text":"Fine data, coarse data, and rough data"},{"label":"D","text":"Historical data, current data, and future dated data"},{"label":"E","text":"Data element value, data instance or record, and data set"}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":161,"chapter":"Data Quality","sourceQuestionNumber":"19","sourceLine":1723,"question":"When the DMBOK calls Data Quality Management a program, not a project, it means","choices":[{"label":"A","text":"Data Quality is more tightly scoped and planned than ordinary projects"},{"label":"B","text":"Data Quality practices can stop at the end of the project"},{"label":"C","text":"Data Quality managers can be paid more that project managers"},{"label":"D","text":"Data quality management is really expensive"},{"label":"E","text":"Data Quality has both project and maintenance work along with communications and training"}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":162,"chapter":"Data Quality","sourceQuestionNumber":"20","sourceLine":1734,"question":"Whose responsibility should it be to identify and report occurrences of defects in information and data?","choices":[{"label":"A","text":"The information quality team"},{"label":"B","text":"Any employee"},{"label":"C","text":"The IT department"},{"label":"D","text":"Regulatory compliance officers"},{"label":"E","text":"Customers"}],"correctAnswer":"B","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":163,"chapter":"Data Quality","sourceQuestionNumber":"21","sourceLine":1744,"question":"What is manual directed Data Quality correction?","choices":[{"label":"A","text":"The automation of all data cleanse and correction routines"},{"label":"B","text":"The use of automated cleanse and correction tools with results manually checked before committing outputs"},{"label":"C","text":"The use of spreadsheets to manually inspect and correct data"},{"label":"D","text":"Teams of data creators supervised by data subject matter experts"},{"label":"E","text":"Using a Data Quality improvement manual to guide data cleanse and correction activities"}],"correctAnswer":"B","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":164,"chapter":"Data Quality","sourceQuestionNumber":"22","sourceLine":1758,"question":"Which one of these is a key process in defining Data Quality business rules?","choices":[{"label":"A","text":"De-duplicating data records"},{"label":"B","text":"Producing Data Management policies"},{"label":"C","text":"Separating data that does not meet business needs from data that does"},{"label":"D","text":"Matching data from different data sources"},{"label":"E","text":"Producing Data Quality reports and dashboards"}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":165,"chapter":"Data Quality","sourceQuestionNumber":"23","sourceLine":1767,"question":"Which of the following is NOT a goal of Data Quality?","choices":[{"label":"A","text":"Develop a governed approach to make data fit for purpose"},{"label":"B","text":"Define standards, requirements, and specifications for Data Quality Controls"},{"label":"C","text":"Implement process to measure, monitor, and report on Data Quality"},{"label":"D","text":"Advocate for opportunities to improve the quality of data"},{"label":"E","text":"The delivery of a Data Quality Strategy and framework"}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":166,"chapter":"Data Quality","sourceQuestionNumber":"24","sourceLine":1776,"question":"What is the definition of a root cause of a problem?","choices":[{"label":"A","text":"The part of the problem that is invisible to the naked eye"},{"label":"B","text":"A factor, that if eliminated, removes the problem itself"},{"label":"C","text":"A multi-factor influencer"},{"label":"D","text":"An incomplete requirement's statement"},{"label":"E","text":"The most obvious aspect of the problem"}],"correctAnswer":"B","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":167,"chapter":"Data Quality","sourceQuestionNumber":"25","sourceLine":1785,"question":"Which of the following is the best example of the Data Quality dimension of consistency?","choices":[{"label":"A","text":"The source data for the end of month report arrived one week late"},{"label":"B","text":"All the records in the CRM have been accounted for in the data warehouse"},{"label":"C","text":"The revenue data in the dataset is always $100 out"},{"label":"D","text":"The customer file has 50% duplicated entries"},{"label":"E","text":"The phone numbers in the customer fle do not adhere to the standard format"}],"correctAnswer":"B","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":168,"chapter":"Data Quality","sourceQuestionNumber":"26","sourceLine":1794,"question":"What is the purpose of referential integrity?","choices":[{"label":"A","text":"Rules that ensure data completeness"},{"label":"B","text":"Rules that ensure data validity"},{"label":"C","text":"Rules that ensure data accuracy"},{"label":"D","text":"Rules that ensure data is fit for organizational needs"},{"label":"E","text":"Rules that ensure data accessibility"}],"correctAnswer":"B","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":169,"chapter":"Data Quality","sourceQuestionNumber":"27","sourceLine":1803,"question":"The sequence for the Shewhart - Deming improvement cycle in DMBoK is","choices":[{"label":"A","text":"Design, Build, Test, Deploy"},{"label":"B","text":"Plan, Document, Implement, Audit"},{"label":"C","text":"Plan, do, check, act"},{"label":"D","text":"Vision, Creation, Evaluation, Optimization"},{"label":"E","text":"Plan, Act, Design, Comply"}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":170,"chapter":"Data Security","sourceQuestionNumber":"1","sourceLine":1817,"question":"Obfuscation or redaction of data is the practice of?","choices":[{"label":"A","text":"Making information available to the public"},{"label":"B","text":"Reducing the size of large databases"},{"label":"C","text":"Selling data"},{"label":"D","text":"Organizing data into meaningful groups"},{"label":"E","text":"Making information anonymous or removing sensitive information."}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":171,"chapter":"Data Security","sourceQuestionNumber":"2","sourceLine":1826,"question":"Which of these are increasingly driving legislation for information security and data privacy?","choices":[{"label":"A","text":"A desire for economic protectionism"},{"label":"B","text":"A recognition of Ethical issues in information management"},{"label":"C","text":"A resistance to open data and transparency"},{"label":"D","text":"An objective of making life more challenging for information management professionals"},{"label":"E","text":"ANSI 859."}],"correctAnswer":"B","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":172,"chapter":"Data Security","sourceQuestionN e defined procedures are tightly defined, with rigid and effective enforcement sanctions, and alignment with technology capabilities."}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":175,"chapter":"Data Security","sourceQuestionNumber":"6","sourceLine":1873,"question":"A RACI matrix is a useful tool to support the ______ in an outsourced arrangement.","choices":[{"label":"A","text":"Transfer of access controls"},{"label":"B","text":"Alignment of Business goals"},{"label":"C","text":"Segregation of duties"},{"label":"D","text":"Service level Agreement"},{"label":"E","text":"Attributing Costs."}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":176,"chapter":"Data Security","sourceQuestionNumber":"7","sourceLine":1882,"question":"Stakeholders whose concerns must be addressed in data security management include","choices":[{"label":"A","text":"Clients, Patients, Citizens, Suppliers, or Business Partners"},{"label":"B","text":"External Standards organisations, Regulators, or the Media"},{"label":"C","text":"Media analysts, Internal Risk Management, Suppliers, or Regulators"},{"label":"D","text":"The Internal Audit and Risk committees of the organisation"},{"label":"E","text":"All of these."}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":177,"chapter":"Data Security","sourceQuestionNumber":"8","sourceLine":1891,"question":"How does Data Security contribute to competitive advantage?","choices":[{"label":"A","text":"Data Security makes it harder for your competitors to find out about who you do business with"},{"label":"B","text":"Data Security makes your competitors invest more effort into trying to find out your trade secrets"},{"label":"C","text":"Governments do not allow organisations to trade if they do not manage Data Security"},{"label":"D","text":"Data Security helps to protect proprietary information and intellectual property, as well as customer and partner information"},{"label":"E","text":"Data security stops organisations going out of business due to an information leak."}],"correctAnswer":"D","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":178,"chapter":"Data Security","sourceQuestionNumber":"9","sourceLine":1906,"question":"The needs of data protection require us to ensure that","choices":[{"label":"A","text":"Data is secured with a password"},{"label":"B","text":"Data can always be freely used in the company as it is a company asset"},{"label":"C","text":"Data is processed only in ways compatible with the intended and communicated use it was collected for, and respects the consent of the data subject"},{"label":"D","text":"Data is encrypted at all times"},{"label":"E","text":"Data is frequently backed up so that it can be recovered in all cases."}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":179,"chapter":"Data Security","sourceQuestionNumber":"10","sourceLine":1917,"question":"Apart from security requirements internal to the organisation, what other strategic goals should a Data Security Management system address?","choices":[{"label":"A","text":"Compliance with ISO29100 and PCI-DSS."},{"label":"B","text":"Compliance with ISO27001 and HIPPA"},{"label":"C","text":"Regulatory requirements for privacy and confidentiality AND Privacy and Confidentiality needs of all stakeholders"},{"label":"D","text":"Ensuring the organisation doesn't engage in SPAM marketing"},{"label":"E","text":"NA"}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"numbered"},{"id":180,"chapter":"Data Security","sourceQuestionNumber":"11","sourceLine":1932,"ques ","choices":[{"label":"A","text":"Dimensional model"},{"label":"B","text":"Physical model"},{"label":"C","text":"Conceptual Model"},{"label":"D","text":"Logical model"},{"label":"E","text":"Database model."}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"structured"},{"id":442,"chapter":"Data Modeling and Design","sourceQuestionNumber":"241","sourceLine":6412,"question":"Components of logical data models include","choices":[{"label":"A","text":"Keys"},{"label":"B","text":"Relationships"},{"label":"C","text":"Entities"},{"label":"D","text":"All of the above"},{"label":"E","text":"Attributes."}],"correctAnswer":"D","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"structured"},{"id":443,"chapter":"Data Storage and Operations","sourceQuestionNumber":"288","sourceLine":6436,"question":"The acronym ACID stands for","choices":[{"label":"A","text":"Atomicity, Consistency, Independence, Dominance"},{"label":"B","text":"Additive, CAP, Independence, Database"},{"label":"C","text":"Atomicity, Cardinality, Instance, Durability"},{"label":"D","text":"Arity, Cardinality, Instance, Development"},{"label":"E","text":"Atomicity, Consistency, Isolation, Durability."}],"correctAnswer":"E","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"structured"},{"id":444,"chapter":"Data Security","sourceQuestionNumber":"320","sourceLine":6460,"question":"Definition of Data Security Policies should be","choices":[{"label":"A","text":"A collaborative effort between Business and IT"},{"label":"B","text":"Reviewed by external Regulators"},{"label":"C","text":"Conducted by external consultants"},{"label":"D","text":"Based on defined standards and templates"},{"label":"E","text":"Determined by external Regulators."}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle": rt in any project at all, declaring it an audit and risk project"},{"label":"B","text":"\"Working with business and technical leadership to find the best answers to a standard set of regulatory compliance questions (How, Why, When, etc)\""},{"label":"C","text":"Create a DG in-house project with a team of data stewards to create a standard response"},{"label":"D","text":"Provide access to any possible data set to the compliance team and allow them to mine the data for non-compliance"},{"label":"E","text":"Work in isolation and mine the data and information for compliance and non- compliance issues"}],"correctAnswer":"B","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"question_label"},{"id":669,"chapter":"Metadata","sourceQuestionNumber":null,"sourceLine":11958,"question":"A comparatively new architectural approach is where volatile data is provisioned in a data warehouse structure to provide transactional systems with a combination of historical and near real time data to meet customer needs. This is a definition of:","choices":[{"label":"A","text":"Active Data Warehousing"},{"label":"B","text":"Operational Data Store"},{"label":"C","text":"On Line Transactional Processing System"},{"label":"D","text":"On Line Analytical Processing Cube"},{"label":"E","text":"Behavioural Decision Support Systems"}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"question_label"},{"id":670,"chapter":"Metadata","sourceQuestionNumber":null,"sourceLine":11974,"question":"Top down' and 'bottom up' data analysis and profiling is best done in concert because:","choices":[{"label":"A","text":"It gets everyone involved."},{"label":"B","text":"It gives something for the architects to do while the profilers get on with the work"},{"label":"C","text":"Data quality tools are more productive when they are effectively configured."},{"label":"D","text":"It balances business relevance and the actual state of the data"},{"label":"E","text":"It allows the profiler to show the business the true state of the data"}],"correctAnswer":"D","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"question_label"},{"id":671,"chapter":"Metadata","sourceQuestionNumber":null,"sourceLine":11989,"question":"Which of the following is NOT a stage in the Shewhart / Deming Cycle that drives the data quality improvement lifecycle:","choices":[{"label":"A","text":"Act"},{"label":"B","text":"Plan"},{"label":"C","text":"Investigate"},{"label":"D","text":"Check"},{"label":"E","text":"Do"}],"correctAnswer":"C","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"question_label"},{"id":672,"chapter":"Metadata","sourceQuestionNumber":null,"sourceLine":12008,"question":"What is Manual Directed Data Quality Correction?","choices":[{"label":"A","text":"The use of automated cleanse & correction tools with results manually checked before committing outputs"},{"label":"B","text":"The automation of all data cleanse and correction routines"},{"label":"C","text":"Teams of data correctors supervised by data subject matter experts"},{"label":"D","text":"Using a data quality improvement manual to guide data cleanse and correction activities"},{"label":"E","text":"The use of spreadsheets to manually inspect and correct data"}],"correctAnswer":"A","multiSelect":false,"answerStatus":"Confirmed in TXT source","explanation":null,"extractionStyle":"question_label"},{"id":673,"chapter":"Metadata","sourceQuestionNumber":null,"sourceLine":12026,"question":"Which of these is NOT an expected role of a Data Quality Oversight Board?","choices":[{"label":"A","text":"Developing & maintaining data quality"},{"label":"B","text":"Setting data quality improvement priorities"},{"label":"C","text":"Data profiling & analysis"},{"label":"D","text":"Establishing communications & feedback mechanisms"},{"label":"E","te
